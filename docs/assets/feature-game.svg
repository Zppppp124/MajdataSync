      <rect x="30" y="337" width="570" height="104" rx="14" fill="#eefaff" stroke="#d9edf5"/>
      <circle cx="65" cy="375" r="19" fill="#dff5ff"/>
      <path d="M56 375h18m-9-9v18" stroke="#53b2d3" stroke-width="3" stroke-linecap="round"/>
      <text x="96" y="373" fill="#4e7a90" font-size="17" font-weight="700">在线缓存</text>
      <text x="96" y="400" fill="#88a6b7" font-size="13">把已下载曲目预热到 Cache\Net\MajdataNET</text>
      <text x="483" y="390" fill="#4ca6c5" font-size="14" font-weight="700">开始预热</text>
    </g>
    <g transform="translate(75 650)">
      <circle cx="8" cy="-5" r="5" fill="#65bf83"/>
      <text x="24" y="0" fill="#6f95a8" font-size="15">切换版本时保留：MaiCharts · Skins · Cache · RecordOutputs · Logs · settings.json</text>
