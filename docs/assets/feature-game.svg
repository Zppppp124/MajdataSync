      <text x="50" y="169" fill="#91aab8" font-size="13">选择 D3D11 / D3D12 / OpenGL / Vulkan</text>
      <rect x="394" y="130" width="180" height="42" rx="9" fill="#eaf6fc" stroke="#d0e5ef"/>
      <text x="417" y="157" fill="#5e879c" font-size="14">默认渲染</text>
      <path d="m545 148 6 6 6-6" stroke="#719bad" stroke-width="2.5" fill="none"/>
      <rect x="30" y="222" width="570" height="98" rx="14" fill="#f7fcff" stroke="#e1eef4"/>
