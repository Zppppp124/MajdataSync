      <text x="50" y="283" fill="#91aab8" font-size="13">本地曲目库 / 在线缓存 / 两者同时写入</text>
      <rect x="394" y="244" width="180" height="42" rx="9" fill="#eaf6fc" stroke="#d0e5ef"/>
