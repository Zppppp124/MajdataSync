name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build-release.ps1
      - name: Archive
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -LiteralPath .\MajdataSync.csproj)).Project.PropertyGroup.Version
          Compress-Archive -Path .\publish\* -DestinationPath ".\MajdataSync-win-x64-v$version.zip"
          Write-Output "RELEASE_ASSET=MajdataSync-win-x64-v$version.zip" >> $env:GITHUB_ENV
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Majdata Sync v1.8.2
          body: |
            ## Majdata Sync v1.8.2

            本次发布包含完整的 Windows x64 自包含版本，无需单独安装 .NET。

            ### 主要更新

            - 曲目卡支持勾选并批量下载所选谱面
            - 每首曲目下载完成后立即入库，中断后无需重下已完成曲目
            - 稳定版固定从 MajdataPlay_Build 获取，测试版使用 MajdataPlay nightly
            - 内嵌 ReleaseFlow 的 GitHub 三路镜像测速与并行下载方案
            - 稳定版 / 测试版可切换，曲目、皮肤、缓存、成绩输出和设置会保留
            - 测试版更新改为下载完整 nightly 包后安全替换程序文件
            - 修复稳定版续传时异常小文件可能中断安装的问题
            - 测试版完整包测速后锁定最快线路，避免下载中在多个镜像间无意义切换
          files: ${{ env.RELEASE_ASSET }}
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
