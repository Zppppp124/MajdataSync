name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build-release.ps1
      - name: Archive
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -LiteralPath .\MajdataSync.csproj)).Project.PropertyGroup.Version
          Compress-Archive -Path .\publish\* -DestinationPath ".\MajdataSync-win-x64-v$version.zip"
          Copy-Item -LiteralPath .\docs\MajdataSync-Manual.html -Destination ".\MajdataSync-Manual.html" -Force
          Copy-Item -LiteralPath ".\docs\assets\screenshots" -Destination ".\MajdataSync-Screenshots" -Recurse -Force
          Compress-Archive -Path ".\MajdataSync-Screenshots\*" -DestinationPath ".\MajdataSync-Screenshots.zip"
          Write-Output "RELEASE_ASSET=MajdataSync-win-x64-v$version.zip" >> $env:GITHUB_ENV
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Majdata Sync v1.12.0
          body: |
            ## Majdata Sync v1.12.0

            本次发布包含完整的 Windows x64 自包含版本，无需单独安装 .NET。

            ### 本次重点

            - **稳定版改为 MajdataHub 同款 CNB 仓库逐文件下载**：使用官方清单与 SHA-256 校验，5 个文件并发。
            - **解决稳定版约 300 MB 断流重来**：不再依赖单个 323 MB ZIP；已完成的文件会直接跳过。
            - **曲目搜索增加难度筛选**：BASIC、ADVANCED、EXPERT、MASTER、RE:MASTER、其他难度，并可继续选择数字等级。
            - **测试版继续使用 Fast 加速**：默认 `ghfast.top`，单次网络波动优先重连当前线路，连续失败后才切换候选。
            - **每首曲目完成即入库**：批量下载中断后再次同步只补缺失或变化的曲目。
            - **版本目录独立**：稳定版、测试版可分别记忆目录；切换、更新不会覆盖 `MaiCharts`、`Skins`、`Cache`、成绩、日志和设置。
            - **图文说明书**：新增 1.12.0 离线 HTML 手册和实拍截图包。

            ### 图文说明

            ![曲目库](https://raw.githubusercontent.com/Zppppp124/MajdataSync/main/docs/assets/screenshots/library.png)

            ![游戏管理](https://raw.githubusercontent.com/Zppppp124/MajdataSync/main/docs/assets/screenshots/game.png)

            ### 附件

            - 主程序：`MajdataSync-win-x64-v1.12.0.zip`
            - 离线图文说明书：`MajdataSync-Manual.html`
            - 实拍截图包：`MajdataSync-Screenshots.zip`

            > 稳定版固定使用 CNB 逐文件下载，不会再因单个大 ZIP 在 300 MB 断流而整体重来。
          files: |
            ${{ env.RELEASE_ASSET }}
            MajdataSync-Manual.html
            MajdataSync-Screenshots.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
