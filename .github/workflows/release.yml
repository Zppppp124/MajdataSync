name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\MajdataSync\build-release.ps1
      - name: Archive
        run: Compress-Archive -Path .\MajdataSync\publish\* -DestinationPath .\MajdataSync-win-x64.zip
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: MajdataSync-win-x64.zip
          generate_release_notes: true
